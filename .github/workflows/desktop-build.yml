name: Desktop Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The Windows-only native binaries pinned in web/package.json devDependencies
    # (@esbuild/win32-x64, @rollup/rollup-win32-x64-msvc, @tailwindcss/oxide-win32-x64-msvc,
    # lightningcss-win32-x64-msvc) fail npm ci with EBADPLATFORM on Linux runners.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
